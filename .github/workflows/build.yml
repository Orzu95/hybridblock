name: App bauen und veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android-SDK prüfen
        run: echo "::notice::ANDROID_HOME=${ANDROID_HOME:-fehlt}"
      - name: Build-Nummer eintragen
        run: echo "{\"build\":${GITHUB_RUN_NUMBER},\"sha\":\"${GITHUB_SHA::7}\"}" > www/build.json
      - run: npm ci
      - run: npx cap sync android
      - name: Signaturschlüssel entschlüsseln
        env:
          RAW_PW: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RAW_PW" ]; then echo "::warning::Secret HB_KEYSTORE_PASSWORD fehlt. Probe-Build ohne festen Schlüssel, kein Release."; exit 0; fi
          ok=""
          # erst das ganze Secret ohne Leerzeichen, dann jedes 32-stellige Wort darin (falls der ganze Text eingefügt wurde)
          for cand in "$(printf %s "$RAW_PW" | tr -d '[:space:]')" $(printf %s "$RAW_PW" | grep -oE '[A-Za-z0-9_-]{32}'); do
            if HBPW="$cand" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/hybridblock.jks.enc -out "$RUNNER_TEMP/hybridblock.jks" -pass env:HBPW 2>/dev/null \
               && keytool -list -keystore "$RUNNER_TEMP/hybridblock.jks" -storepass "$cand" >/dev/null 2>&1; then ok="$cand"; break; fi
          done
          if [ -z "$ok" ]; then echo "::error title=Schlüssel::Passwort im Secret HB_KEYSTORE_PASSWORD passt nicht (Länge ${#RAW_PW} Zeichen, erwartet 32)."; exit 1; fi
          echo "::add-mask::$ok"
          echo "HB_KEYSTORE=$RUNNER_TEMP/hybridblock.jks" >> "$GITHUB_ENV"
          echo "HB_KEYSTORE_PASSWORD=$ok" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee gradle.log; then
            msg=$(grep -E "error|Error|What went wrong|FAILURE|> |e: " gradle.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::${msg}"
            exit 1
          fi
      - run: cp android/app/build/outputs/apk/release/app-release.apk Hybridblock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hybridblock-APK
          path: Hybridblock.apk
      - name: Als Release veröffentlichen
        if: env.HB_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hybridblock Build ${{ github.run_number }}
          body: "Auf dem Handy herunterladen und über die alte Version installieren. Deine Daten bleiben erhalten."
          files: Hybridblock.apk
          make_latest: true
      - name: Web-App vorbereiten
        run: cp -r www site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: apk
    continue-on-error: true
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
