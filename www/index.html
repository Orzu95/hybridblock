<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hybridblock</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Training mit Autoregulation, Ernährung mit adaptivem Kalorienbedarf und die Gesundheitsdaten deiner Uhr in einer App.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="view" class="wrap" tabindex="-1"></main>

<div id="timer" class="timer" hidden><div class="in">
  <div class="tm-l"><span class="tm-label" id="tmLabel">Pause</span><span class="tm-t" id="tmTime">0:00</span></div>
  <div class="tm-bar"><i id="tmBar"></i></div>
  <div class="tm-b"><button id="tmMinus" type="button">−15 s</button><button id="tmPlus" type="button">+30 s</button><button id="tmStop" type="button">Fertig</button></div>
</div></div>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>

<div id="scanner" class="scanner" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="frame" aria-hidden="true"></div>
  <div class="bar">
    <button class="iconbtn" type="button" data-act="scanClose" aria-label="Scanner schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="grow">Barcode scannen</span>
    <button class="iconbtn" type="button" id="torchBtn" data-act="torch" aria-label="Taschenlampe" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h8l-1 6H9L8 3zM9 9h6v11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V9zM12 13v2"/></svg></button>
  </div>
  <div class="bot">
    <div class="msg" id="scanMsg">Strichcode in den Rahmen halten</div>
    <div class="row"><input id="scanCode" type="text" inputmode="numeric" placeholder="Nummer eintippen" class="grow" aria-label="Barcode-Nummer"><button class="btn brand" type="button" data-act="scanManual">Suchen</button></div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<nav class="tabbar" id="tabbar"><div class="in">
  <a href="#heute" data-r="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Heute</a>
  <a href="#training" data-r="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg>Training</a>
  <a href="#essen" data-r="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M9 8c0-1.5 2-1.5 2-3M14 8c0-1.5 2-1.5 2-3"/></svg>Essen</a>
  <a href="#verlauf" data-r="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/></svg>Verlauf</a>
  <button class="fab" type="button" data-act="plus" aria-label="Hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div></nav>

<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileZepp" accept=".zip,.csv,text/csv,application/zip" multiple hidden>
<script src="vendor/fflate.min.js"></script>
<script src="i18n.js"></script>
<script src="lang-en.js"></script>
<script src="lang-ru.js"></script>
<script src="cues-ru.js"></script>
<script src="data.js"></script>
<script src="library.js"></script>
<script src="bodymap.js"></script>
<script src="app.js"></script>
<script src="connect.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="track.js"></script>
<script src="planner.js"></script>
<script src="cloud.js"></script>
<script src="privacy.js"></script>
</body>
</html>
